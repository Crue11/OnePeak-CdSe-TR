services:
  - type: web
    name: cdse-onepeak-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGIN
        sync: false # set to the frontend's Render URL, e.g. https://cdse-onepeak-frontend.onrender.com

  - type: web
    name: cdse-onepeak-frontend
    runtime: static
    buildCommand: npx pnpm@10.34.3 install --frozen-lockfile && npx pnpm@10.34.3 run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # set to the API's Render URL, e.g. https://cdse-onepeak-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
